<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="46" fill="#212529" />

  <!-- Chart bars -->
  <rect x="18" y="52" width="12" height="22" rx="2" fill="#6ea8fe" />
  <rect x="34" y="38" width="12" height="36" rx="2" fill="#6ea8fe" />
  <rect x="50" y="28" width="12" height="46" rx="2" fill="#0d6efd" />
  <rect x="66" y="42" width="12" height="32" rx="2" fill="#6ea8fe" />

  <!-- Trend line -->
  <polyline
    points="24,52 40,38 56,28 72,42"
    fill="none"
    stroke="#ffc107"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Dots on trend line -->
  <circle cx="24" cy="52" r="3" fill="#ffc107" />
  <circle cx="40" cy="38" r="3" fill="#ffc107" />
  <circle cx="56" cy="28" r="3" fill="#ffc107" />
  <circle cx="72" cy="42" r="3" fill="#ffc107" />
</svg>
