[project]
name = "dash-app-template"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dash==4.3.0",
    "dash-bootstrap-components==2.0.4",
    "dash-ag-grid==35.3.0",
    "gunicorn==26.0.0",
    "pandas==3.0.5",
    "plotly==6.9.0",
    "python-dotenv==1.2.3",
    "sqlalchemy==2.0.51",
    # SSO — only needed when SSO_ENABLED=true (production/staging)
    # Install manually: uv add python3-saml
    # Requires libxml2-dev and libxmlsec1-dev system packages
    # "python3-saml==1.16.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "mongomock==4.3.0",
    "pymongo==4.17.0",
]

[tool.pytest.ini_options]
# Make /app (the rootdir) importable so tests can reach utils/, auth/, components/
pythonpath = ["."]
testpaths = ["tests"]
